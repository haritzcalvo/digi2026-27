<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tablas</title>
  <style>
    td,th
    {
      border: 1px solid black;
      border-collapse: collapse;
    }

  </style>
</head>
<body>
<table>
  <caption><strong>LISTA DE LA COMPRA</strong></caption>
  <thead>
  <tr>
    <th>producto</th>
    <th>precio</th>
    <th>cantidad</th>
  </tr>
  </thead>
  <tr>
    <td>Naranja</td>
    <td>2€</td>
    <td>2kg</td>
  </tr>
  <tr>
    <td>Peras</td>
    <td>1,5€</td>
    <td>1kg</td>
  </tr>
  <tr>
    <td>platanos</td>
    <td colspan="2"> 5kg6€</td>
  </tr>
  <tr>
    <td colspan="2"> total</td>
    <td> 8kg</td>

  </tr>
</table>
</body>
</html>
